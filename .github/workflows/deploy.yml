name: Deploy Suture Hero to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        # Node 24 occasionally aborts a Vitest worker inside V8 ("Fatal error ... unreachable code",
        # then "Channel closed"; twice on 2026-11-27). Retry once only for that crash; real test
        # failures still fail the job.
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test-output.log; then exit 0; fi
          if grep -qE "Fatal error in|ERR_IPC_CHANNEL_CLOSED" test-output.log; then
            echo "::warning::Vitest worker crashed inside V8; retrying the unit tests once."
            npm test
          else
            exit 1
          fi
      # Cache the compiled WASM across workflow runs. The key changes only when
      # the OpenCV build scripts/config or pinned toolchain change.
      - name: Restore compiled OpenCV.js
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: vendor/opencv.js
          key: opencv5-emsdk607-${{ hashFiles('scripts/build-opencv/**') }}
      - name: Build calibration-enabled OpenCV.js (cache miss only)
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-opencv/fetch-and-build.sh
        timeout-minutes: 120
      - name: Verify OpenCV.js artifact
        run: test -s vendor/opencv.js
      - name: Build
        run: npm run build
      - name: Include OpenCV.js in Pages output
        run: mkdir -p dist/vendor && cp vendor/opencv.js dist/vendor/opencv.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Browser checks (scripts/ci-browser-checks.mjs): the app in a real, software-rendered
  # Chrome. A push that breaks layout, Sandbox, Production mode, jaw sensors, the iPhone
  # start or the Tracking Lab does not deploy.
  browser-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build (check-layout uses the production preview)
        run: npx vite build
      - name: Fetch js-aruco2 2.0.0 for marker checks (check-full-scan)
        run: |
          mkdir -p "$RUNNER_TEMP/aruco"
          cd "$RUNNER_TEMP/aruco"
          npm pack js-aruco2@2.0.0
          tar xzf js-aruco2-2.0.0.tgz
      - name: Run browser checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: ARUCO_LIBRARY_DIR="$RUNNER_TEMP/aruco/package/src" node scripts/ci-browser-checks.mjs

  deploy:
    needs: [build, browser-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
