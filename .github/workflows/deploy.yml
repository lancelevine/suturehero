name: Deploy Suture Hero to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      # Cache the compiled WASM across workflow runs. The key changes only when
      # the OpenCV build scripts/config or pinned toolchain change.
      - name: Restore compiled OpenCV.js
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: vendor/opencv.js
          key: opencv5-emsdk607-${{ hashFiles('scripts/build-opencv/**') }}
      - name: Build calibration-enabled OpenCV.js (cache miss only)
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-opencv/fetch-and-build.sh
        timeout-minutes: 120
      - name: Verify OpenCV.js artifact
        run: test -s vendor/opencv.js
      - name: Build
        run: npm run build
      - name: Include OpenCV.js in Pages output
        run: mkdir -p dist/vendor && cp vendor/opencv.js dist/vendor/opencv.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
